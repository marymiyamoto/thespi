<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thespi — Your Broadway Journey</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0a0e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
      background: linear-gradient(160deg, #482060 0%, #2A1040 50%, #0d0a0e 100%);
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(154,123,18,0.35);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 72px);
      color: #B8922A;
      letter-spacing: 3px;
      margin-bottom: 16px;
    }

    .tagline {
      font-size: clamp(16px, 3vw, 20px);
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      max-width: 600px;
      margin-bottom: 52px;
    }

    .feature {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }

    .app-store-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #B8922A;
      color: #0d0a0e;
      text-decoration: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      transition: opacity 0.2s;
    }

    .app-store-btn:hover { opacity: 0.85; }

    .app-store-btn svg { flex-shrink: 0; }

    footer {
      text-align: center;
      padding: 28px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 24px;
    }

    footer a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
    }

    footer a:hover { color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <section class="hero">
    <img class="logo" src="https://raw.githubusercontent.com/marymiyamoto/thespi/main/app-icon.png" alt="Thespi" onerror="this.style.display='none'" />
    <h1>Thespi</h1>
    <p class="tagline">Rate, rank, and discover live theatre. The social platform for Broadway and beyond.</p>

    <div class="features">
      <div class="feature">Head-to-head show rankings</div>
      <div class="feature">Community reviews</div>
      <div class="feature">Track shows you've seen</div>
      <div class="feature">Discover what's on now</div>
    </div>

    <a class="app-store-btn" href="https://apps.apple.com/app/thespi/id6746766529" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      Download on the App Store
    </a>
  </section>

  <footer>
    <span>© 2026 Thespi</span>
    <a href="https://privacy.thespiapp.com">Privacy Policy</a>
    <a href="https://privacy.thespiapp.com/support">Support</a>
  </footer>
</body>
</html>
